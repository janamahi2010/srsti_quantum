<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#16297a"/>
      <stop offset="55%" stop-color="#0a1a4d"/>
      <stop offset="100%" stop-color="#060f30"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5851f"/>
      <stop offset="100%" stop-color="#e2231a"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb26b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e2231a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 100 H1600 M0 200 H1600 M0 300 H1600 M0 400 H1600 M0 500 H1600 M0 600 H1600 M0 700 H1600 M0 800 H1600"/>
    <path d="M100 0 V900 M300 0 V900 M500 0 V900 M700 0 V900 M900 0 V900 M1100 0 V900 M1300 0 V900 M1500 0 V900"/>
  </g>

  <!-- glow blobs -->
  <circle cx="1250" cy="220" r="260" fill="#e2231a" opacity="0.16" filter="url(#blurBig)"/>
  <circle cx="260" cy="700" r="220" fill="#f5851f" opacity="0.14" filter="url(#blurBig)"/>

  <!-- orbit system 1 -->
  <g transform="translate(1180,320)">
    <ellipse cx="0" cy="0" rx="260" ry="100" fill="none" stroke="url(#lineGrad)" stroke-opacity="0.55" stroke-width="1.4" transform="rotate(-18)"/>
    <ellipse cx="0" cy="0" rx="260" ry="100" fill="none" stroke="#8fa6ff" stroke-opacity="0.3" stroke-width="1.2" transform="rotate(34)"/>
    <ellipse cx="0" cy="0" rx="260" ry="100" fill="none" stroke="#8fa6ff" stroke-opacity="0.22" stroke-width="1" transform="rotate(90)"/>
    <circle cx="0" cy="0" r="14" fill="url(#nodeGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#ffe4c2"/>
    <circle cx="238" cy="-45" r="6" fill="#f5851f" filter="url(#blurSmall)"/>
    <circle cx="-238" cy="45" r="6" fill="#e2231a" filter="url(#blurSmall)"/>
    <circle cx="70" cy="96" r="5" fill="#ffb26b"/>
    <circle cx="-90" cy="-96" r="4" fill="#8fa6ff"/>
  </g>

  <!-- orbit system 2 -->
  <g transform="translate(300,520)">
    <ellipse cx="0" cy="0" rx="190" ry="75" fill="none" stroke="url(#lineGrad)" stroke-opacity="0.4" stroke-width="1.2" transform="rotate(12)"/>
    <ellipse cx="0" cy="0" rx="190" ry="75" fill="none" stroke="#8fa6ff" stroke-opacity="0.22" stroke-width="1" transform="rotate(-40)"/>
    <circle cx="0" cy="0" r="10" fill="url(#nodeGlow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffe4c2"/>
    <circle cx="175" cy="-25" r="4" fill="#f5851f"/>
    <circle cx="-150" cy="60" r="4" fill="#e2231a"/>
  </g>

  <!-- connecting circuit lines -->
  <g stroke="url(#lineGrad)" stroke-width="1.3" stroke-opacity="0.35" fill="none">
    <path d="M0 780 L220 780 L280 720 L520 720 L560 760 L900 760"/>
    <path d="M1600 140 L1380 140 L1330 190 L1080 190"/>
    <path d="M1600 620 L1440 620 L1400 660 L1180 660 L1150 630"/>
  </g>
  <g fill="#f5851f">
    <circle cx="220" cy="780" r="3.5"/>
    <circle cx="560" cy="760" r="3.5"/>
    <circle cx="1380" cy="140" r="3.5"/>
    <circle cx="1150" cy="630" r="3.5"/>
  </g>

  <!-- scattered qubits -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="70" cy="150" r="2"/>
    <circle cx="150" cy="260" r="1.6"/>
    <circle cx="960" cy="120" r="2"/>
    <circle cx="740" cy="620" r="1.8"/>
    <circle cx="1500" cy="480" r="2"/>
    <circle cx="420" cy="230" r="1.6"/>
    <circle cx="1300" cy="770" r="2"/>
  </g>
</svg>
