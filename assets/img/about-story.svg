<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560">
  <defs>
    <linearGradient id="asBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a4d"/>
      <stop offset="100%" stop-color="#060f30"/>
    </linearGradient>
    <linearGradient id="asAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5851f"/>
      <stop offset="100%" stop-color="#e2231a"/>
    </linearGradient>
    <filter id="asGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="700" height="560" rx="18" fill="url(#asBg)"/>
  <circle cx="560" cy="120" r="150" fill="#e2231a" opacity="0.16" filter="url(#asGlow)"/>
  <circle cx="120" cy="460" r="130" fill="#f5851f" opacity="0.14" filter="url(#asGlow)"/>

  <!-- quantum chip -->
  <g transform="translate(350,280)">
    <rect x="-140" y="-140" width="280" height="280" rx="20" fill="#101d55" stroke="#2a3a8c" stroke-width="2"/>
    <rect x="-100" y="-100" width="200" height="200" rx="14" fill="#16297a" stroke="#3a4ba0" stroke-width="1.5"/>

    <!-- qubit grid -->
    <g fill="url(#asAccent)">
      <circle cx="-60" cy="-60" r="9"/>
      <circle cx="0" cy="-60" r="9"/>
      <circle cx="60" cy="-60" r="9"/>
      <circle cx="-60" cy="0" r="9"/>
      <circle cx="0" cy="0" r="11"/>
      <circle cx="60" cy="0" r="9"/>
      <circle cx="-60" cy="60" r="9"/>
      <circle cx="0" cy="60" r="9"/>
      <circle cx="60" cy="60" r="9"/>
    </g>
    <g stroke="#8fa6ff" stroke-width="2" stroke-opacity="0.6">
      <line x1="-60" y1="-60" x2="0" y2="-60"/>
      <line x1="0" y1="-60" x2="60" y2="-60"/>
      <line x1="-60" y1="-60" x2="-60" y2="0"/>
      <line x1="0" y1="-60" x2="0" y2="0"/>
      <line x1="60" y1="-60" x2="60" y2="0"/>
      <line x1="-60" y1="0" x2="0" y2="0"/>
      <line x1="0" y1="0" x2="60" y2="0"/>
      <line x1="-60" y1="0" x2="-60" y2="60"/>
      <line x1="0" y1="0" x2="0" y2="60"/>
      <line x1="60" y1="0" x2="60" y2="60"/>
      <line x1="-60" y1="60" x2="0" y2="60"/>
      <line x1="0" y1="60" x2="60" y2="60"/>
    </g>

    <!-- leads out to edges -->
    <g stroke="#f5851f" stroke-width="2" stroke-opacity="0.7">
      <line x1="-100" y1="-60" x2="-140" y2="-60"/>
      <line x1="-100" y1="0" x2="-140" y2="0"/>
      <line x1="-100" y1="60" x2="-140" y2="60"/>
      <line x1="100" y1="-60" x2="140" y2="-60"/>
      <line x1="100" y1="0" x2="140" y2="0"/>
      <line x1="100" y1="60" x2="140" y2="60"/>
      <line x1="-60" y1="-100" x2="-60" y2="-140"/>
      <line x1="0" y1="-100" x2="0" y2="-140"/>
      <line x1="60" y1="-100" x2="60" y2="-140"/>
      <line x1="-60" y1="100" x2="-60" y2="140"/>
      <line x1="0" y1="100" x2="0" y2="140"/>
      <line x1="60" y1="100" x2="60" y2="140"/>
    </g>
  </g>

  <g fill="#ffffff" opacity="0.45">
    <circle cx="90" cy="90" r="2.4"/>
    <circle cx="600" cy="470" r="2.4"/>
    <circle cx="630" cy="300" r="2"/>
    <circle cx="60" cy="260" r="2"/>
  </g>
</svg>
