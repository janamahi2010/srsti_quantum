<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a4d"/>
      <stop offset="100%" stop-color="#16297a"/>
    </linearGradient>
    <linearGradient id="hwAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5851f"/>
      <stop offset="100%" stop-color="#e2231a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#hwBg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 150 H800 M0 300 H800 M0 450 H800"/>
    <path d="M200 0 V600 M400 0 V600 M600 0 V600"/>
  </g>

  <!-- dilution refrigerator / cryostat, chandelier style -->
  <g transform="translate(400,60)">
    <!-- top plate -->
    <rect x="-130" y="0" width="260" height="26" rx="6" fill="#c7d0f0"/>
    <line x1="-90" y1="26" x2="-90" y2="440" stroke="#5a6bb0" stroke-width="2"/>
    <line x1="90" y1="26" x2="90" y2="440" stroke="#5a6bb0" stroke-width="2"/>

    <!-- stage 1 -->
    <path d="M-170 90 L170 90 L120 160 L-120 160 Z" fill="#eef1fb" stroke="#9aa8dd" stroke-width="2"/>
    <!-- stage 2 -->
    <path d="M-140 210 L140 210 L100 275 L-100 275 Z" fill="#dbe1f7" stroke="#8b9adf" stroke-width="2"/>
    <!-- stage 3 -->
    <path d="M-105 320 L105 320 L75 380 L-75 380 Z" fill="#c3cdf3" stroke="#7484d6" stroke-width="2"/>
    <!-- mixing chamber -->
    <circle cx="0" cy="430" r="42" fill="url(#hwAccent)"/>
    <circle cx="0" cy="430" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

    <!-- coax cables -->
    <path d="M-90 60 C -200 60, -200 250, -150 430" fill="none" stroke="#f5851f" stroke-width="2.5" stroke-opacity="0.75"/>
    <path d="M90 60 C 200 60, 200 250, 150 430" fill="none" stroke="#e2231a" stroke-width="2.5" stroke-opacity="0.75"/>
    <path d="M-60 60 C -140 90, -150 300, -60 420" fill="none" stroke="#8fa6ff" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M60 60 C 140 90, 150 300, 60 420" fill="none" stroke="#8fa6ff" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- ambient qubit glow accents -->
  <circle cx="120" cy="500" r="60" fill="#e2231a" opacity="0.14"/>
  <circle cx="680" cy="120" r="70" fill="#f5851f" opacity="0.12"/>
  <g fill="#ffffff" opacity="0.4">
    <circle cx="100" cy="90" r="2.5"/>
    <circle cx="660" cy="470" r="2.5"/>
    <circle cx="720" cy="330" r="2"/>
    <circle cx="80" cy="330" r="2"/>
  </g>
</svg>
